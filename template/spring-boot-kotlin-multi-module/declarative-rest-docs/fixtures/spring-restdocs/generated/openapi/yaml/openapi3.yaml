                properties:
                  age:
                    type: number
                    description: 회원 나이
                  tags:
                    type: array
                    description: 회원 태그
                    items:
                      type: string
              name:
                type: string
                description: 회원 이름
              active:
                type: boolean
                description: 활성 여부
              id:
                type: number
                description: 회원 식별자
              email:
                type: string
                description: 회원 이메일
    api-members104719280:
      required:
      - active
      - email
      - id
      - name
      type: object
      properties:
        profile:
          required:
          - age
          - tags
          type: object
          properties:
            age:
              type: number
              description: 회원 나이
            tags:
              type: array
              description: 회원 태그
              items:
                type: string
        name:
          type: string
          description: 회원 이름
        active:
          type: boolean
          description: 활성 여부
        id:
          type: number
          description: 회원 식별자
        email:
          type: string
