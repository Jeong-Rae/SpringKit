# 참고: https://docs.gradle.org/current/userguide/gradle_wrapper.html
# 압축을 해제한 Gradle 배포판을 저장할 기준 디렉터리입니다.
distributionBase=GRADLE_USER_HOME
# 기준 디렉터리 아래에서 압축을 해제한 배포판을 저장할 경로입니다.
distributionPath=wrapper/dists
# 사용할 Gradle 배포판의 공식 다운로드 주소입니다.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# 배포판을 다운로드할 때 사용할 네트워크 제한 시간입니다. 단위는 밀리초입니다.
networkTimeout=10000
# 다운로드 실패 시 추가로 시도할 횟수입니다.
retries=0
# 재시도 사이에 기다릴 초기 시간입니다. 이후 재시도마다 대기 시간이 늘어납니다.
retryBackOffMs=500
# 배포판 다운로드 전에 URL을 검증합니다.
validateDistributionUrl=true
# 다운로드한 ZIP을 저장할 기준 디렉터리입니다.
zipStoreBase=GRADLE_USER_HOME
# 기준 디렉터리 아래에서 다운로드한 ZIP을 저장할 경로입니다.
zipStorePath=wrapper/dists
