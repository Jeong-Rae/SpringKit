name: CI

on:
  pull_request:
    paths:
      - "template/spring-boot-kotlin/**"
      - "template/spring-boot-kotlin-multi-module/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - template/spring-boot-kotlin
          - template/spring-boot-kotlin-multi-module

    env:
      SPOTLESS_RATCHET_FROM: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless Check
        working-directory: ${{ matrix.project }}
        run: ./gradlew spotlessCheck

      - name: Gradle Test
        working-directory: ${{ matrix.project }}
        run: ./gradlew test

      - name: Gradle Build
        working-directory: ${{ matrix.project }}
        run: ./gradlew build
