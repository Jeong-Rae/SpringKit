when:
  - file_changed
match:
  any: []
content: |
  # 예외 처리 함수 분리하기

  예외 처리의 대상과 책임을 드러내어 실패 처리 중에 정상 업무나 복구 정책이 실행되지 않도록 합니다.

  ## 작성 지침

  첫째, 프로젝트 자체 규칙으로 예외 처리 함수의 이름은 `handle`로 시작하고 어떤 실패를 처리하는지 표현합니다. `handleFailure`처럼 대상이 없는 이름은 주변 맥락만으로 처리 대상이 명확한 경우에만 사용합니다.

  둘째, 예외 처리 함수는 해당 실패의 기록과 알림을 담당합니다. 실패 처리 중에 정상 업무를 진행하지 않습니다.

  셋째, 서로 다른 실패를 하나의 예외 처리 함수에 묶지 않습니다. 실패마다 함수를 나누어 해당 예외와 처리 책임을 명확하게 드러냅니다.

  넷째, 재시도, 보상, 대체 동작이 필요하다면 해당 정책을 책임지는 별도 함수나 객체에서 처리합니다. 예외 처리 함수가 복구 정책을 결정하거나 실행하지 않습니다.

  ## Do Not 예시

  ```kotlin
  fun reportCommissionCalculationFailure(trade: Trade, exception: CommissionCalculationException) { // Do Not: 예외 처리 함수에 handle 접두사 누락
      commissionRepository.updateStatus(trade.id, CommissionStatus.CALCULATION_FAILED)
      logger.warn("수수료 계산 실패: 거래 {}", trade.id, exception)
  }

  reportCommissionCalculationFailure(trade, exception) // Do Not: 호출 이름에 handle 접두사 누락
  ```

  ```kotlin
  fun handleCommissionCalculationFailure(trade: Trade, exception: CommissionCalculationException) {
      commissionRepository.updateStatus(trade.id, CommissionStatus.CALCULATION_FAILED)
      logger.warn("수수료 계산 실패: 거래 {}", trade.id, exception)
      trade.confirmCommission() // Do Not: 실패 처리 중 수수료 확정 진행
  }

  handleCommissionCalculationFailure(trade, exception) // Do Not: 실패 처리 호출이 정상 업무까지 수행
  ```

  ```kotlin
  fun handleCommissionFailure(trade: Trade, exception: Exception) {
      when (exception) { // Do Not: 계산 실패와 정산 실패를 하나의 함수에서 처리
          is CommissionCalculationException -> {
              commissionRepository.updateStatus(trade.id, CommissionStatus.CALCULATION_FAILED)
              logger.warn("수수료 계산 실패: 거래 {}", trade.id, exception)
          }
          is CommissionSettlementException -> {
              commissionRepository.updateStatus(trade.id, CommissionStatus.SETTLEMENT_FAILED)
              logger.warn("수수료 정산 실패: 거래 {}", trade.id, exception)
          }
      }
  }

  handleCommissionFailure(trade, exception) // Do Not: 호출 이름에서 처리할 실패를 구분할 수 없음
  ```

  ## Do 예시

  ```kotlin
  fun handleCommissionCalculationFailure(trade: Trade, exception: CommissionCalculationException) { // Do: handle 접두사와 수수료 계산 실패 대상 표현
      commissionRepository.updateStatus(trade.id, CommissionStatus.CALCULATION_FAILED) // Do: 계산 실패 상태 저장
      logger.warn("수수료 계산 실패: 거래 {}", trade.id, exception) // Do: 실패한 거래와 예외 기록
  }

  fun handleCommissionSettlementFailure(trade: Trade, exception: CommissionSettlementException) { // Do: 정산 실패를 계산 실패와 별도의 함수로 분리
      commissionRepository.updateStatus(trade.id, CommissionStatus.SETTLEMENT_FAILED) // Do: 정산 실패 상태 저장
      logger.warn("수수료 정산 실패: 거래 {}", trade.id, exception) // Do: 실패한 거래와 예외 기록
  }
  ```

  ```kotlin
  try {
      calculateAndSettleCommission(trade) // Do: 정상 업무는 예외 처리 함수 밖에서 수행
  } catch (exception: CommissionCalculationException) {
      handleCommissionCalculationFailure(trade, exception) // Do: 계산 실패에 해당하는 함수 호출
  } catch (exception: CommissionSettlementException) {
      handleCommissionSettlementFailure(trade, exception) // Do: 정산 실패에 해당하는 함수 호출
  }
  ```
