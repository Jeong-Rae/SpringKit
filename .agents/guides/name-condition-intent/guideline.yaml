id: name-condition-intent
scope:
  repositories:
    - "*"
  languages:
    - "*"
when:
  - file_changed
match:
  any: []
content: |
  # 조건식의 판단 의도를 이름으로 드러내기

  계산이나 검색 과정을 해석하지 않아도 무엇을 판단하는지 알 수 있게 합니다.

  ## 작성 지침

  첫째, `if`의 조건은 판단 의도를 나타내는 Boolean 지역 변수로 표현합니다. 이름에는 `is`, `has`, `can`, `should` 등의 접두사를 사용합니다.

  둘째, 복합 조건은 의미가 구분되는 판단 단위로 나누고, 각 변수를 조합해 최종 조건을 만듭니다. 메서드 호출이나 컬렉션 연산도 구현을 읽어야 의미를 알 수 있다면 판단 의도를 변수 이름으로 드러냅니다.

  셋째, 단순한 `null` 비교나 상태 비교는 의미가 분명하면 그대로 사용합니다.

  ## Do Not 예시

  ```kotlin
  if (order.quantity > 0 && account.balance() >= order.amount) { // Do Not: 수량과 잔액 비교를 직접 해석
      orderGateway.submit(order)
  }
  ```

  ```kotlin
  if (orders.any { it.symbol == symbol && it.status == OrderStatus.FILLED }) { // Do Not: 검색 조건을 읽어 판단 의도 파악
      notifyRepeatPurchase(symbol)
  }
  ```

  ## Do 예시

  ```kotlin
  val isQuantityValid = order.quantity > 0 // Do: 판단 단위별 이름 지정
  val hasBuyingPower = account.balance() >= order.amount
  val canSubmitBuyOrder = isQuantityValid && hasBuyingPower // Do: 판단 결과를 조합

  if (canSubmitBuyOrder) {
      orderGateway.submit(order)
  }
  ```

  ```kotlin
  val hasFilledBuyOrder = orders.any { // Do: 검색의 판단 의도를 이름으로 표현
      it.symbol == symbol && it.status == OrderStatus.FILLED
  }

  if (hasFilledBuyOrder) {
      notifyRepeatPurchase(symbol)
  }
  ```

  ```kotlin
  if (quote == null) { // Do: 의미가 분명한 null 비교를 직접 사용
      requestQuote(symbol)
  }

  if (order.status == OrderStatus.ACCEPTED) { // Do: 의미가 분명한 상태 비교를 직접 사용
      notifyAccepted(order)
  }
  ```
