content: |
  # 동일한 추상화 수준

  함수 안에서 비슷한 수준의 개념을 다루어 흐름을 쉽게 파악하도록 합니다.

  ## 작성 지침

  추상화 수준은 작업을 세부 구현으로 나누어 내려가는 개념적 계층입니다. 한 함수에서 다루는 작업은 그 함수보다 한 단계 아래에서 대체로 비슷한 수준을 이루도록 합니다.

  수준은 작업의 의미를 기준으로 판단합니다. 함수 호출의 모양이나 실제 호출 깊이를 같게 맞출 필요는 없습니다.

  세부 구현은 의미를 드러내는 이름으로 분리합니다. 다만 수준을 맞추기 위한 분리가 핵심 흐름을 가리지 않도록 합니다.

  ## Do Not 예시

  ```kotlin
  fun placeBuyOrder(order: BuyOrder) {
      validateOrder(order)
      account.reserve(order.price * order.quantity) // Do Not: 주문 흐름에 금액 계산의 세부 구현 혼합
      submitOrder(order)
  }
  ```

  ```kotlin
  fun openSecuritiesAccount(application: Application) {
      verifyIdentity(application)
      checkMinimumAge(application) // Do Not: 가입 자격 확인의 세부 조건과 계좌 개설 단계를 나란히 배치
      checkResidence(application)
      createAccount(application)
  }
  ```

  ```kotlin
  fun sendTradeStatement(trades: List<Trade>) {
      try {
          sendTradeStatementInternal(trades) // Do Not: 수준을 맞추려고 명세서 작성과 발송 흐름 전체를 숨김
      } catch (exception: DeliveryException) {
          reportDeliveryFailure(exception)
      }
  }
  ```

  ## Do 예시

  ```kotlin
  fun placeBuyOrder(order: BuyOrder) {
      validateOrder(order)
      reserveOrderAmount(order) // Do: 검증과 제출에 나란히 놓이는 금액 예약 작업
      submitOrder(order)
  }

  private fun reserveOrderAmount(order: BuyOrder) {
      account.reserve(order.price * order.quantity) // Do: 금액 예약을 담당하는 곳에서 계산 방법 구현
  }
  ```

  ```kotlin
  fun openSecuritiesAccount(application: Application) {
      verifyIdentity(application)
      verifyEligibility(application) // Do: 본인 확인과 계좌 생성에 나란히 놓이는 가입 자격 확인
      createAccount(application)
  }

  private fun verifyEligibility(application: Application) {
      checkMinimumAge(application) // Do: 가입 자격 확인 아래의 세부 조건
      checkResidence(application)
  }
  ```

  ```kotlin
  fun sendTradeStatement(trades: List<Trade>) {
      try {
          val statement = createTradeStatement(trades) // Do: 명세서 작성과 발송 흐름 유지
          sendStatement(statement)
      } catch (exception: DeliveryException) {
          reportDeliveryFailure(exception) // Do: 오류 보고의 세부 구현만 분리
      }
  }
  ```

  ```kotlin
  fun totalOrderAmount(orders: List<BuyOrder>): Long {
      var total = 0L
      for (order in orders) {
          total += order.price * order.quantity // Do: 합계 계산 수준에서 순회와 연산을 함께 사용
      }
      return total
  }
  ```
