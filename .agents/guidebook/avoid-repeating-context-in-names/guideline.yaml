id: avoid-repeating-context-in-names
scope:
  repositories:
    - "*"
  languages:
    - "*"
when:
  - file_changed
match:
  any: []
content: |
  # 상위 맥락을 이름에 반복하지 않기

  주변 코드에서 알 수 있는 정보를 덜어 이름을 간결하게 유지합니다.

  ## 작성 지침

  첫째, 패키지나 모듈에서 드러나는 맥락을 클래스 이름에 반복하지 않습니다. 클래스나 객체에서 드러나는 맥락도 속성이나 함수 이름에 반복하지 않습니다.

  둘째, 중복 여부는 이름을 읽는 위치에서 판단합니다. 반복한 표현을 생략해도 상위 맥락과 함께 읽으면 의미가 분명해야 합니다.

  ## Do Not 예시

  ```kotlin
  package commission

  class CommissionRate // Do Not: 패키지의 수수료 맥락 반복

  class CommissionPolicy // Do Not: 패키지의 수수료 맥락 반복
  ```

  ```kotlin
  data class Order(
      val orderQuantity: Int, // Do Not: Order의 주문 맥락 반복
      val orderPrice: Long, // Do Not: Order의 주문 맥락 반복
  )

  val order = Order(orderQuantity = 10, orderPrice = 50_000)
  order.orderQuantity // Do Not: order의 주문 맥락 반복
  order.orderPrice // Do Not: order의 주문 맥락 반복
  ```

  ```kotlin
  class Account {
      fun accountBalance(): Long = ... // Do Not: Account의 계좌 맥락 반복
      fun closeAccount() { ... } // Do Not: Account의 계좌 맥락 반복
  }

  val account = Account()
  account.accountBalance() // Do Not: account의 계좌 맥락 반복
  account.closeAccount() // Do Not: account의 계좌 맥락 반복
  ```

  ## Do 예시

  ```kotlin
  package commission

  class Rate // Do: 패키지에 있는 수수료 표현 생략

  class Policy // Do: 패키지에 있는 수수료 표현 생략
  ```

  ```kotlin
  data class Order(
      val quantity: Int, // Do: Order에 있는 주문 표현 생략
      val price: Long, // Do: Order에 있는 주문 표현 생략
  )

  val order = Order(quantity = 10, price = 50_000)
  order.quantity // Do: order로 주문 수량의 의미 전달
  order.price // Do: order로 주문 가격의 의미 전달
  ```

  ```kotlin
  class Account {
      fun balance(): Long = ... // Do: Account에 있는 계좌 표현 생략
      fun close() { ... } // Do: Account에 있는 계좌 표현 생략
  }

  val account = Account()
  account.balance() // Do: account로 계좌 잔액의 의미 전달
  account.close() // Do: account로 계좌 해지의 의미 전달
  ```
