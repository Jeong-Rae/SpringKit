id: use-unchecked-exceptions
scope:
  repositories:
    - "*"
  languages:
    - "*"
when:
  - file_changed
match:
  any: []
content: |
  # Unchecked 예외 사용하기

  예외 선언을 중간 계층에 반복하지 않고, 필요한 계층에서 실패를 처리합니다.

  ## 작성 지침

  첫째, 애플리케이션에서 정의하는 예외는 `RuntimeException`을 상속합니다. 이는 프로젝트 규칙이며, Kotlin 자체는 `Exception`을 상속해도 예외 처리나 선언을 강제하지 않습니다.

  둘째, 외부 라이브러리의 checked 예외는 필요한 경계에서 애플리케이션의 unchecked 예외로 변환합니다. 원인은 내부에서 해석하거나 기록하고, 호출자에게는 자체 예외만 전달합니다. 이미 계약에 맞는 예외를 다시 감싸지 않습니다.

  셋째, unchecked 예외도 대응이 필요한 계층에서 처리합니다. 처리나 선언이 강제되지 않는다는 이유로 실패를 무시하지 않습니다.

  ## Do Not 예시

  ```kotlin
  class CommissionUnavailableException : Exception() // Do Not: Java에서 checked 예외가 되는 계층 사용
  ```

  ```kotlin
  fun loadCommission(tradeId: TradeId): Commission {
      return commissionFile.read(tradeId) // Do Not: 외부 라이브러리의 IOException을 그대로 전파
  }
  ```

  ## Do 예시

  ```kotlin
  class CommissionUnavailableException : RuntimeException() // Do: unchecked 예외 계층 사용
  ```

  ```kotlin
  fun loadCommission(tradeId: TradeId): Commission {
      try {
          return commissionFile.read(tradeId)
      } catch (exception: IOException) {
          logger.warn("수수료 조회 실패: 거래 {}", tradeId, exception)
          throw CommissionUnavailableException() // Do: 자체 unchecked 예외로 변환
      }
  }
  ```
